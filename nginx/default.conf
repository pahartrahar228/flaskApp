server {
    listen 80;
    server_name test-devops.vizorlabs.tech:80;


#    location / {
#        proxy_pass http://test-app:1283;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#    }



    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}



server {
    listen 443 ssl;
    server_name test-devops.vizorlabs.tech:443;

    ssl_certificate /etc/letsencrypt/live/test-devops.vizorlabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-devops.vizorlabs.tech/privkey.pem;

    location / {
        proxy_pass http://test-app:1283;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
